[project]
name = "musicrec"
version = "0.1.0"
description = "Music discovery recommendation on Yambda-50M: popularity, iALS, BPR and SASRec under a time-based evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "scipy>=1.15.3",
    "implicit>=0.7.3",
    "threadpoolctl>=3.7.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicrec"]

[tool.uv]
link-mode = "copy"
